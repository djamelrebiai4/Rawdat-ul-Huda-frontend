<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#faf7ee"/>
      <stop offset="100%" stop-color="#f0ead8"/>
    </linearGradient>
    <pattern id="stars" width="100" height="100" patternUnits="userSpaceOnUse">
      <g stroke="#b8983f" stroke-opacity="0.10" stroke-width="1" fill="none">
        <rect x="25" y="25" width="24" height="24" transform="rotate(45 37 37)"/>
        <rect x="32" y="32" width="10" height="10"/>
      </g>
    </pattern>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#stars)"/>

  <rect x="0" y="0" width="1200" height="10" fill="#0e2e25"/>

  <!-- Logo -->
  <image href="/logo.png" x="430" y="100" width="340" height="340"/>

  <text x="600" y="520" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="30" font-weight="600" fill="#0e2e25" letter-spacing="2">1-ON-1 TAJWEED &amp; ARABIC CLASSES</text>
  <text x="600" y="565" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#b8983f">Learn Quran · Adults &amp; Kids · Worldwide</text>
</svg>