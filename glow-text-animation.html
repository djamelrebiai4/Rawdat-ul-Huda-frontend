<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Electric Lightning Streak</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body { background: #04050a; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }

    .container {
      max-width: 760px;
      width: 100%;
      position: relative;
    }

    .electric-text {
      position: relative;
      font-size: 1.45rem;
      line-height: 1.7;
      font-weight: 600;
      color: rgba(255, 255, 255, 0.30);
    }

    .electric-text::after {
      content: attr(data-text);
      position: absolute;
      inset: 0;
      pointer-events: none;
      background-image:
        linear-gradient(115deg,
          transparent 40%,
          rgba(120, 240, 255, 0.9) 47%,
          #eaffff 49%,
          #ffffff 50%,
          #eaffff 51%,
          rgba(120, 240, 255, 0.9) 53%,
          transparent 60%),
        linear-gradient(115deg,
          transparent 42%,
          rgba(60, 180, 255, 0.35) 46%,
          rgba(60, 180, 255, 0.35) 48%,
          transparent 52%);
      background-size: 300% 300%;
      background-repeat: no-repeat;
      background-clip: text;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      mix-blend-mode: screen;
      filter: blur(0.5px)
        drop-shadow(0 0 4px rgba(120, 230, 255, 0.9))
        drop-shadow(0 0 12px rgba(60, 180, 255, 0.55))
        drop-shadow(0 0 26px rgba(30, 120, 255, 0.35));
      opacity: 0;
      animation:
        electric-sweep 4.5s ease-in-out infinite,
        electric-flicker 4.5s ease-in-out infinite;
    }

    @keyframes electric-sweep {
      0%   { background-position: 300% 300%; }
      38%  { background-position: 300% 300%; }
      60%  { background-position: -200% -200%; }
      100% { background-position: -200% -200%; }
    }

    @keyframes electric-flicker {
      0%, 38% { opacity: 0; }
      39% { opacity: 0.9; }
      41% { opacity: 0.45; }
      43% { opacity: 1; }
      45% { opacity: 0.55; }
      48% { opacity: 1; }
      52% { opacity: 0.9; }
      56% { opacity: 1; }
      60%, 100% { opacity: 0; }
    }

    @supports not ((background-clip: text) or (-webkit-background-clip: text)) {
      .electric-text::after { display: none; }
      .electric-text { color: rgba(255, 255, 255, 0.75); }
    }

    @media (prefers-reduced-motion: reduce) {
      .electric-text::after { display: none; }
      .electric-text { color: rgba(255, 255, 255, 0.75); }
    }
  </style>
</head>
<body>
  <div class="container">
    <p class="electric-text"
       data-text="1-on-1 Tajweed and Arabic classes for adults and kids, anywhere in the world. Learn to read and recite the Quran with correct Tajweed from qualified teachers. Personalized lessons at your pace, on your schedule.">1-on-1 Tajweed and Arabic classes for adults and kids, anywhere in the world. Learn to read and recite the Quran with correct Tajweed from qualified teachers. Personalized lessons at your pace, on your schedule.</p>
  </div>
</body>
</html>
